# Publica la página web (carpeta web/) en GitHub Pages cada vez que se sube un cambio a main.
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
#
# Seguridad: cada acción está fijada a un commit exacto (SHA) y no a una etiqueta, porque una
# etiqueta puede moverse a código distinto. El comentario indica la versión para actualizarla.
name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto, solo lectura. Cada trabajo pide únicamente lo que necesita.
permissions:
  contents: read

# Si llegan dos pushes seguidos, se cancela el despliegue viejo y queda el más reciente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compilar el sitio con Astro
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: ./web
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Permisos que exige GitHub Pages para publicar; solo los tiene este trabajo.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
